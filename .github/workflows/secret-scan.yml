name: Secret scan

# Falla si el árbol o CUALQUIER commit del historial contiene secretos, archivos .env/claves o correos reales.
# Complementa (no sustituye) el "secret scanning" y "push protection" nativos de GitHub.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del detector
        run: node --test scripts/
      - name: Árbol versionado
        run: node scripts/check-secrets.mjs --all
      - name: Historial completo
        run: node scripts/check-secrets.mjs --all --history
